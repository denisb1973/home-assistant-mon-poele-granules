title: Roborock Qrevo CurvX
# Dashboard indépendant. Ne touche pas à l'intégration du poêle.
# La photo doit être placée manuellement dans /config/www/roborock/roborock_salon.png.
views:
  - title: Accueil
    path: accueil
    icon: mdi:home-variant
    cards:
      - type: horizontal-stack
        cards:
          - type: button
            name: Accueil
            icon: mdi:home-variant
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /roborock-curvx/accueil
          - type: button
            name: Carte
            icon: mdi:map
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /roborock-curvx/carte
          - type: button
            name: Historique
            icon: mdi:history
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /roborock-curvx/historique
          - type: button
            name: Station
            icon: mdi:home-automation
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /roborock-curvx/station
          - type: button
            name: Entretien
            icon: mdi:tools
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /roborock-curvx/entretien
          - type: button
            name: Réglages
            icon: mdi:cog
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /roborock-curvx/reglages
      - type: picture-elements
        image: /local/roborock/roborock_salon.png
        elements:
          - type: state-label
            entity: sensor.salle_a_manger_roborock_qrevo_curvx_batterie
            prefix: '🔋 Batterie : '
            style:
              left: 76%
              top: 25%
              width: 38%
              padding: 10px
              border-radius: 12px
              color: white
              background: 'rgba(14,20,36,0.78)'
              font-size: 16px
          - type: state-label
            entity: sensor.salle_a_manger_roborock_qrevo_curvx_etat
            prefix: '🤖 État : '
            style:
              left: 76%
              top: 43%
              width: 38%
              padding: 10px
              border-radius: 12px
              color: white
              background: 'rgba(14,20,36,0.78)'
              font-size: 16px
          - type: state-label
            entity: sensor.salle_a_manger_roborock_qrevo_curvx_piece_actuelle
            prefix: '📍 Pièce : '
            style:
              left: 76%
              top: 61%
              width: 38%
              padding: 10px
              border-radius: 12px
              color: white
              background: 'rgba(14,20,36,0.78)'
              font-size: 16px
          - type: icon
            icon: mdi:map
            style:
              left: 87%
              top: 84%
              color: white
              '--mdc-icon-size': 38px
            tap_action:
              action: navigate
              navigation_path: /roborock-curvx/carte
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.salle_a_manger_roborock_qrevo_curvx_batterie
            name: Batterie
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 60
          - type: gauge
            entity: sensor.salle_a_manger_roborock_qrevo_curvx_progression_du_nettoyage
            name: Progression
            min: 0
            max: 100
            needle: true
      - type: tile
        entity: vacuum.salle_a_manger_roborock_qrevo_curvx
        name: Commandes du robot
        icon: mdi:robot-vacuum
        features:
          - type: vacuum-commands
            commands:
              - start_pause
              - stop
              - return_home
      - type: entities
        title: Résumé
        show_header_toggle: false
        entities:
          - entity: sensor.salle_a_manger_roborock_qrevo_curvx_surface_de_nettoyage
            name: Surface nettoyée
          - entity: sensor.salle_a_manger_roborock_qrevo_curvx_duree_de_nettoyage
            name: Durée
          - entity: sensor.salle_a_manger_roborock_qrevo_curvx_piece_actuelle
            name: Pièce actuelle
  - title: Carte
